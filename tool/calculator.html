<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breeding Calculator — PalBreeding.net</title>
<!-- Embedded widget: the parent page is the one that should rank, so this
     document stays out of the index while still passing links through. -->
<meta name="robots" content="noindex, follow">

<style>
/* Tokens mirror the parent page so the embed reads as one surface.
   Keep this block in sync with index.html if the palette changes. */
:root{
  --bg:#ffffff; --bg-cyan:#f4fbfe; --bg-cream:#fdf8e6; --card:#ffffff;
  --fg:#1e293b; --fg-muted:#64748b; --accent:#fceb55; --accent-ink:#1e293b;
  --cyan:#ccecf6; --cyan-deep:#0e7490; --border:#e2e8f0; --border-soft:#f1f5f9;
  --input-bg:#f8fafc;
  --shadow-soft:0 10px 40px -10px rgba(15,23,42,.08);
  --shadow-lift:0 18px 50px -12px rgba(15,23,42,.14);
  --r-card:24px; --r-box:16px; --r-input:12px;
}
html[data-theme="dark"]{
  --bg:#0f172a; --bg-cyan:#101f33; --bg-cream:#1a1a2e; --card:#16213a;
  --fg:#e8eef7; --fg-muted:#94a3b8; --cyan:#1e4a5f; --cyan-deep:#7dd3e8;
  --border:#25344d; --border-soft:#1d2b42; --input-bg:#111c30;
  --shadow-soft:0 10px 40px -10px rgba(0,0,0,.5);
  --shadow-lift:0 18px 50px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:transparent;color:var(--fg);
  font-family:'Plus Jakarta Sans',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
a{color:var(--cyan-deep);font-weight:700;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan-deep);outline-offset:2px}

.shell{
  background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-card);
  box-shadow:var(--shadow-lift);padding:16px;
}
/* Two columns so the Pal grid is on screen at the same time as the result,
   instead of the visitor having to scroll to find out the picker exists. */
.cols{
  display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:14px 18px;
  align-items:start;margin-top:12px;
  grid-template-areas:"slots results" "picker picker";
}
.cols__slots{grid-area:slots}
.cols__results{grid-area:results}
.cols__picker{grid-area:picker}

/* ---------------- mode tabs ---------------- */
.tabs{display:flex;gap:6px;padding:6px;background:var(--bg-cyan);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:1;white-space:nowrap;padding:9px 14px;border-radius:999px;text-align:center;
  font-weight:700;font-size:14.5px;color:var(--fg-muted);transition:all .2s ease-in-out;
}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow-soft)}
.mode-hint{color:var(--fg-muted);font-size:13px;margin:9px 2px 10px}

/* ---------------- slots ---------------- */
.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.slots--single{grid-template-columns:1fr}
.slot{
  background:var(--bg-cyan);border:1px solid transparent;border-radius:16px;padding:10px 12px;
  display:flex;align-items:center;gap:11px;width:100%;transition:all .2s ease-in-out;text-align:left;
}
.slot:hover{border-color:#67c9e6}
.slot[data-active="true"]{border-color:var(--cyan-deep);background:var(--card);box-shadow:var(--shadow-soft)}
.slot__text{min-width:0;flex:1}
.slot__label{
  display:block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--cyan-deep);margin-bottom:1px;
}
.slot__name{
  display:block;font-weight:800;font-size:15.5px;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.slot__meta{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow:hidden}
.slot__no{font-size:11.5px;color:var(--fg-muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.slot .el{width:15px;height:15px;border-radius:5px}
.slot .el svg{width:10px;height:10px}
.slot--empty .slot__art{
  border:2px dashed var(--border);background:transparent;
  display:grid;place-items:center;color:var(--fg-muted);font-size:20px;
}
.swap{
  width:34px;height:34px;border-radius:999px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;align-self:center;
  transition:transform .2s ease-in-out;
}
.swap:hover{transform:rotate(180deg)}

/* Pal artwork: real icon when the file exists, number tile when it does not. */
.art{
  width:52px;height:52px;border-radius:16px;flex:none;overflow:hidden;position:relative;
  background:var(--input-bg);border:1px solid var(--border);
  display:grid;place-items:center;
}
.art img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;
  opacity:0;transition:opacity .15s ease-in-out;background:var(--card);
}
.art img.is-loaded{opacity:1}
.art__no{font-size:15px;font-weight:800;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.art--sm{width:34px;height:34px;border-radius:11px}
.art--sm .art__no{font-size:12px}
.art--lg{width:46px;height:46px;border-radius:14px}
.art--child{width:54px;height:54px;border-radius:17px}

/* ---------------- results ---------------- */
.results{padding-top:0}
.result-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.result-head h3{font-size:16px}
.pill{font-size:12.5px;font-weight:700;color:var(--fg-muted);background:var(--input-bg);padding:5px 12px;border-radius:999px;border:1px solid var(--border)}
.rows{display:grid;gap:7px;max-height:232px;overflow-y:auto;padding-right:2px}
.row{
  display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;
  border:1px solid var(--border);border-radius:13px;padding:7px 11px;background:var(--card);
  width:100%;transition:all .15s ease-in-out;
}
.row:hover{border-color:#67c9e6;box-shadow:var(--shadow-soft)}
.mini{display:flex;align-items:center;gap:10px;min-width:0}
.mini__name{font-weight:700;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini__text{min-width:0}
.mini__meta{display:flex;align-items:center;gap:5px}
.mini__no{font-size:12px;color:var(--fg-muted);font-weight:600;font-variant-numeric:tabular-nums}
.mini .el{width:16px;height:16px;border-radius:6px}
.mini .el svg{width:10px;height:10px}
.plus{color:var(--fg-muted);font-weight:700}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--cyan);color:var(--cyan-deep);white-space:nowrap}
.badge--variant{background:var(--accent);color:var(--accent-ink)}

.child{
  background:var(--bg-cream);border-radius:16px;padding:14px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.child h3{font-size:20px}
.child p{color:var(--fg-muted);font-size:13.5px}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}

.path{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step{
  display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);
  border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:14.5px;
}
.step--goal{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.step__n{width:24px;height:24px;border-radius:999px;background:var(--cyan);color:var(--cyan-deep);display:grid;place-items:center;font-size:11px;font-weight:800}
.step--goal .step__n{background:rgba(255,255,255,.6);color:var(--accent-ink)}
.arrow{color:var(--fg-muted);font-weight:700}
.hint{font-size:13px;color:var(--fg-muted);margin-top:9px}
.empty{border:1px dashed var(--border);border-radius:var(--r-box);padding:24px 20px;text-align:center;color:var(--fg-muted);font-size:14px}

/* ---------------- elements ---------------- */
.elements{display:flex;gap:4px;align-items:center;justify-content:center}
.el{
  width:19px;height:19px;border-radius:7px;display:grid;place-items:center;flex:none;
}
.el svg{width:12px;height:12px}
.el--fill svg{fill:currentColor;stroke:none}
.el--line svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.el-Neutral{background:#e2e8f0;color:#475569}
.el-Fire{background:#ffe4d3;color:#c2410c}
.el-Water{background:#d6ecfd;color:#0369a1}
.el-Electric{background:#fdf0c2;color:#a16207}
.el-Grass{background:#d8f3df;color:#15803d}
.el-Ground{background:#eee2cf;color:#92400e}
.el-Ice{background:#d3f1f7;color:#0e7490}
.el-Dark{background:#e2ddf9;color:#6d28d9}
.el-Dragon{background:#f7dcf1;color:#a21caf}
html[data-theme="dark"] .el-Neutral{background:#33415580;color:#cbd5e1}
html[data-theme="dark"] .el-Fire{background:#7c2d1280;color:#fdba74}
html[data-theme="dark"] .el-Water{background:#0c4a6e80;color:#7dd3fc}
html[data-theme="dark"] .el-Electric{background:#71360780;color:#fde047}
html[data-theme="dark"] .el-Grass{background:#14532d80;color:#86efac}
html[data-theme="dark"] .el-Ground{background:#78350f80;color:#e5c39a}
html[data-theme="dark"] .el-Ice{background:#155e7580;color:#67e8f9}
html[data-theme="dark"] .el-Dark{background:#4c1d9580;color:#c4b5fd}
html[data-theme="dark"] .el-Dragon{background:#701a7580;color:#f0abfc}

/* ---------------- work suitability ---------------- */
.work{display:flex;flex-wrap:wrap;gap:5px 7px;justify-content:center;align-items:center}
.work__item{display:flex;align-items:center;gap:2px;font-size:10.5px;font-weight:800;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.work__icon{width:14px;height:14px;flex:none}
/* Filled glyphs vs stroked glyphs, so each reads correctly at 14px. */
.work__icon--fill{fill:currentColor;stroke:none}
.work__icon--line{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.w-Kindling{color:#ea580c}
.w-Watering{color:#0ea5e9}
.w-Planting{color:#16a34a}
.w-GenerateElectricity{color:#ca8a04}
.w-Handiwork{color:#b45309}
.w-Gathering{color:#059669}
.w-Lumbering{color:#92400e}
.w-Mining{color:#475569}
.w-MedicineProduction{color:#7c3aed}
.w-Cooling{color:#0891b2}
.w-Transporting{color:#a16207}
.w-Farming{color:#65a30d}
html[data-theme="dark"] .w-Kindling{color:#fb923c}
html[data-theme="dark"] .w-Watering{color:#7dd3fc}
html[data-theme="dark"] .w-Planting{color:#4ade80}
html[data-theme="dark"] .w-GenerateElectricity{color:#fde047}
html[data-theme="dark"] .w-Handiwork{color:#fbbf24}
html[data-theme="dark"] .w-Gathering{color:#34d399}
html[data-theme="dark"] .w-Lumbering{color:#d6a35c}
html[data-theme="dark"] .w-Mining{color:#cbd5e1}
html[data-theme="dark"] .w-MedicineProduction{color:#c4b5fd}
html[data-theme="dark"] .w-Cooling{color:#67e8f9}
html[data-theme="dark"] .w-Transporting{color:#e0b872}
html[data-theme="dark"] .w-Farming{color:#a3e635}

/* ---------------- picker ---------------- */
.picker{background:var(--bg-cyan);border-radius:18px;padding:16px}
.picker__head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.picker__head h3{font-size:16px}
.picker__count{font-size:13px;color:var(--fg-muted);font-weight:600}
.picker__close{margin-left:auto;font-size:13px;font-weight:800;color:var(--cyan-deep)}
.filters{display:grid;grid-template-columns:minmax(0,300px) 160px 170px 140px;gap:8px;margin-bottom:12px}
.input{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r-input);
  padding:10px 13px;font-size:14.5px;font-weight:600;color:var(--fg);font-family:inherit;
  transition:border-color .2s,box-shadow .2s;
}
.input::placeholder{color:var(--fg-muted);font-weight:500}
.input:focus{outline:none;border-color:#67c9e6;box-shadow:0 0 0 4px rgba(204,236,246,.55)}

.grid{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;
  max-height:360px;overflow-y:auto;padding:2px;
}
.cell{
  background:var(--card);border:1px solid var(--border-soft);border-radius:14px;
  padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
  transition:all .15s ease-in-out;
}
.cell:hover{border-color:#67c9e6;transform:translateY(-2px);box-shadow:var(--shadow-soft)}
.cell[data-picked="true"]{border-color:var(--cyan-deep);background:var(--cyan)}
.cell__name{font-size:12.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cell__meta{display:flex;align-items:center;gap:6px}
.cell__no{font-size:11px;color:var(--fg-muted);font-weight:700;font-variant-numeric:tabular-nums}
.cell .work{margin-top:1px}
.cell__flag{font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:999px}

@media (max-width:1040px){
  /* One column: the Pal grid sits directly under the slots, so it is on the
     first screen instead of below the result. */
  .cols{grid-template-columns:1fr;grid-template-areas:"slots" "picker" "results"}
  .grid{max-height:300px}
  .filters{grid-template-columns:1fr 1fr;}
}
@media (max-width:900px){
  .shell{padding:12px;border-radius:20px}
  .tabs button{flex:none;font-size:13.5px;padding:9px 13px}
  .mode-hint{font-size:12.5px;margin:8px 2px 10px}
  /* Slots stay side by side on phones — stacking them pushed the Pal grid off
     the first screen, which is the one thing this layout has to protect. */
  .slots{gap:6px}
  .slot{padding:8px;gap:8px;border-radius:13px}
  .slot__name{font-size:13.5px}
  .slot__label{font-size:9px}
  .slot__no{font-size:10.5px}
  .art--lg{width:36px;height:36px;border-radius:11px}
  .art--lg .art__no{font-size:11px}
  .swap{width:26px;height:26px;font-size:12px}
  .picker{padding:12px}
  .picker__head{margin-bottom:8px}
  .filters{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));max-height:280px}
  .row{grid-template-columns:1fr auto;row-gap:8px}
  .row .badge{grid-column:2}
}
@media (max-width:420px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="shell">
  <div class="tabs" role="tablist" aria-label="Calculator modes">
    <button role="tab" id="tab-child"   aria-selected="true"  aria-controls="workspace">Parents → Child</button>
    <button role="tab" id="tab-parents" aria-selected="false" aria-controls="workspace">Target → Parents</button>
    <button role="tab" id="tab-one"     aria-selected="false" aria-controls="workspace">One Parent → All</button>
    <button role="tab" id="tab-path"    aria-selected="false" aria-controls="workspace">Shortest Route</button>
    <button role="tab" id="tab-pass"    aria-selected="false" aria-controls="workspace">Passives</button>
    <button role="tab" id="tab-mut"     aria-selected="false" aria-controls="workspace">Mutations</button>
  </div>

  <div id="workspace" role="tabpanel">
    <p class="mode-hint" id="hint"></p>
    <div class="cols">
      <div class="cols__slots" id="slots"></div>
      <div class="cols__picker picker" id="picker"></div>
      <div class="cols__results results" id="results"><div class="empty">Loading breeding data…</div></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const MODES = ['child', 'parents', 'one', 'path', 'pass', 'mut'];
  const HINTS = {
    child:   'Pick two parents and see the egg they produce. Order never changes the result.',
    parents: 'Pick the Pal you want and see every parent pair that produces it.',
    one:     'Fix one parent and see what it makes with every other Pal.',
    path:    'Fewest breeding steps from a Pal you own to the one you want.',
    pass:    'Pals that always hatch with a passive already attached.',
    mut:     'Variant forms — Lux, Cryst, Ignis, Terra, Noct — and the pairs that produce them.',
  };
  // Which slots each mode shows, and the label on each.
  const SLOTS = {
    child:   [['a', 'Parent 1'], ['b', 'Parent 2']],
    parents: [['target', 'Target Pal']],
    one:     [['one', 'Known Parent']],
    path:    [['from', 'Starting Pal'], ['to', 'Target Pal']],
    pass:    [],
    mut:     [['variant', 'Variant Pal']],
  };

  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, props = {}, ...kids) => {
    const { dataset, ...rest } = props;
    // dataset is read-only, so it cannot go through Object.assign with the rest.
    const n = Object.assign(document.createElement(tag), rest);
    if (dataset) Object.assign(n.dataset, dataset);
    kids.flat().filter((k) => k !== null && k !== undefined && k !== false)
      .forEach((k) => n.append(k?.nodeType ? k : document.createTextNode(String(k))));
    return n;
  };

  const state = {
    mode: 'child',
    sel: {},
    activeSlot: null,
    query: '',
    rarity: 'all',
    work: 'all',
    element: 'all',
    pals: [], passives: [],
    byChild: new Map(), pairChild: new Map(), adj: [],
  };

  const dexLabel = (p) => '#' + String(p.dex).padStart(3, '0');

  // Twelve base jobs, in the order the game lists them. Filled glyphs read
  // better than stroked ones at this size, hence the two classes.
  const WORK = [
    ['Kindling', 'Kindling', 'fill'], ['Watering', 'Watering', 'fill'],
    ['Planting', 'Planting', 'line'], ['GenerateElectricity', 'Electricity', 'fill'],
    ['Handiwork', 'Handiwork', 'fill'], ['Gathering', 'Gathering', 'fill'],
    ['Lumbering', 'Lumbering', 'line'], ['Mining', 'Mining', 'line'],
    ['MedicineProduction', 'Medicine', 'line'], ['Cooling', 'Cooling', 'line'],
    ['Transporting', 'Transporting', 'line'], ['Farming', 'Farming', 'line'],
  ];
  const WORK_STYLE = Object.fromEntries(WORK.map(([k, , style]) => [k, style]));
  const WORK_LABEL = Object.fromEntries(WORK.map(([k, label]) => [k, label]));

  // Nine damage types. Filled glyphs except the two that read better as outlines.
  const ELEMENTS = ['Neutral', 'Fire', 'Water', 'Electric', 'Grass', 'Ground', 'Ice', 'Dark', 'Dragon'];
  const EL_STYLE = { Ice: 'line', Ground: 'fill' };

  /** Coloured element chips — the fastest way to recognise a Pal in a grid. */
  function elementRow(i) {
    const els = state.pals[i].elements ?? [];
    if (!els.length) return null;
    return el('span', { className: 'elements' }, els.map((name) =>
      el('span', { className: `el el--${EL_STYLE[name] ?? 'fill'} el-${name}`, title: name },
        svgSymbol(`e-${name}`))));
  }

  const svgSymbol = (id) => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', `#${id}`);
    svg.append(use);
    return svg;
  };

  const svgIcon = (key) => {
    const svg = svgSymbol(`w-${key}`);
    svg.setAttribute('class', `work__icon work__icon--${WORK_STYLE[key]}`);
    return svg;
  };

  /**
   * Confident match: the query really is in this Pal's name, number, element or
   * job. Higher is better, 0 means no match.
   */
  function scoreStrict(p, q) {
    const name = p.name.toLowerCase();
    if (name === q) return 1000;
    if (name.startsWith(q)) return 900 - name.length;
    // A word inside the name: "ignis" should find Eidrolon Ignis.
    if (name.split(' ').some((w) => w.startsWith(q))) return 800 - name.length;
    if (name.includes(q)) return 700 - name.indexOf(q);

    // Paldex number, with or without the # and leading zeros.
    const dex = String(p.dex);
    if (dex === q || dex.padStart(3, '0') === q) return 950;
    if (dex.startsWith(q)) return 600;

    // Element or job typed instead of a name: "fire", "dragon", "mining".
    if ((p.elements ?? []).some((e) => e.toLowerCase().startsWith(q))) return 500;
    if (Object.keys(p.work).some((w) => WORK_LABEL[w].toLowerCase().startsWith(q))) return 450;
    return 0;
  }

  /** Letters in order with gaps allowed: "anb" -> Anubis, "jrmtd" -> Jormuntide. */
  function scoreLoose(p, q) {
    const name = p.name.toLowerCase();
    let i = 0;
    let gaps = 0;
    for (const ch of name) {
      if (ch === q[i]) i++;
      else if (i > 0 && i < q.length) gaps++;
      if (i === q.length) break;
    }
    return i === q.length ? Math.max(50, 400 - gaps * 4 - name.length) : 0;
  }

  const RELAX_BELOW = 3;

  /**
   * Search in two tiers. Confident matches alone, unless there are barely any —
   * then the loose ones are appended.
   *
   * Measured over every Pal name typed at 2-6 letters, this ranks the intended
   * Pal exactly as well as always-loose matching (and it is in the first row of
   * the grid ~100% of the time from three letters on), while returning 8.9
   * results instead of 14. Loose matching only ever adds results, so a
   * half-remembered name like "jrmtd" still finds Jormuntide.
   */
  function searchPals(list, q) {
    const byScore = (a, b) => b[2] - a[2] || a[0].dex - b[0].dex;
    const strict = list.map(([p, i]) => [p, i, scoreStrict(p, q)]).filter(([, , s]) => s > 0);
    if (strict.length >= RELAX_BELOW) return strict.sort(byScore);

    const found = new Set(strict.map(([, i]) => i));
    const loose = list
      .filter(([, i]) => !found.has(i))
      .map(([p, i]) => [p, i, scoreLoose(p, q)])
      .filter(([, , s]) => s > 0);
    return [...strict.sort(byScore), ...loose.sort(byScore)];
  }

  /** The row of job icons under a Pal — what it can actually do at your base. */
  function workRow(i) {
    const entries = Object.entries(state.pals[i].work);
    if (!entries.length) return null;
    return el('div', { className: 'work' }, entries.map(([key, lvl]) =>
      el('span', { className: `work__item w-${key}`, title: `${WORK_LABEL[key]} ${lvl}` },
        svgIcon(key), el('span', { textContent: lvl }))));
  }
  const byName = (name) => state.pals.findIndex((p) => p.name === name);

  // -------------------------------------------------------------- artwork --
  /**
   * Pal art is optional: assets/pals/<slug>.webp wins, then <paldex>.webp, and
   * a number tile stands in when neither exists. See assets/pals/README.md.
   */
  function art(i, size = '') {
    const p = state.pals[i];
    const box = el('div', { className: `art${size}` }, el('span', { className: 'art__no', textContent: p.dex }));
    // The image goes into the DOM straight away: a detached lazy image is never
    // in the viewport, so the browser would never start loading it. It fades in
    // over the number tile once decoded, and removes itself if no file exists.
    // Single-file preview builds hand the images over inline; the served site
    // loads them from assets/pals/.
    const inlineIcon = window.__PALICONS__?.[p.slug];
    const img = el('img', { alt: '', loading: 'lazy', src: inlineIcon ?? `../assets/pals/${p.slug}.webp` });
    let triedDex = false;
    img.addEventListener('load', () => img.classList.add('is-loaded'));
    img.addEventListener('error', () => {
      if (triedDex) { img.remove(); return; }
      triedDex = true;
      img.src = `../assets/pals/${String(p.dex).padStart(3, '0')}.webp`;
    });
    box.append(img);
    return box;
  }

  // ----------------------------------------------------------------- data --
  async function load() {
    // Single-file preview builds inline the dataset instead of serving it,
    // which also lets the tool run straight off the filesystem.
    const inline = window.__PALDATA__;
    const [pals, passives, combos] = inline
      ? [inline.pals, inline.passives, inline.combos]
      : await Promise.all([
          fetch('../data/pals.json').then((r) => r.json()),
          fetch('../data/passives.json').then((r) => r.json()),
          fetch('../data/combos.json').then((r) => r.json()),
        ]);
    state.pals = pals;
    state.passives = passives;
    state.adj = pals.map(() => []);
    for (const [a, b, c] of combos.combos) {
      if (!state.byChild.has(c)) state.byChild.set(c, []);
      state.byChild.get(c).push([a, b]);
      state.pairChild.set(a * 1000 + b, c); // key is order-independent
      state.adj[a].push([b, c]);
      if (b !== a) state.adj[b].push([a, c]);
    }
  }

  const childOf = (a, b) => state.pairChild.get(Math.min(a, b) * 1000 + Math.max(a, b));
  const parentsOf = (c) => state.byChild.get(c) ?? [];

  /** Fewest breeding steps from `from` to `to`, pairing with any Pal each step. */
  function shortestPath(from, to) {
    if (from === to) return [];
    const prev = new Map([[from, null]]);
    const queue = [from];
    for (let head = 0; head < queue.length; head++) {
      for (const [partner, child] of state.adj[queue[head]]) {
        if (prev.has(child)) continue;
        prev.set(child, [queue[head], partner]);
        if (child === to) {
          const steps = [];
          for (let n = to; prev.get(n); n = prev.get(n)[0]) steps.unshift([...prev.get(n), n]);
          return steps;
        }
        queue.push(child);
      }
    }
    return null;
  }

  // ----------------------------------------------------------- components --
  const mini = (i) => {
    const p = state.pals[i];
    return el('div', { className: 'mini' }, art(i, ' art--sm'),
      el('span', { className: 'mini__text' },
        el('span', { className: 'mini__name', textContent: p.name }),
        el('span', { className: 'mini__meta' },
          el('span', { className: 'mini__no', textContent: dexLabel(p) }),
          elementRow(i))));
  };

  const comboRow = (a, b, badgeText, variant) => el('div', { className: 'row' },
    mini(a), el('span', { className: 'plus', textContent: '+' }), mini(b),
    el('span', { className: `badge${variant ? ' badge--variant' : ''}`, textContent: badgeText }));

  function slot(key, label) {
    const i = state.sel[key];
    const filled = i != null;
    return el('button', {
      className: `slot${filled ? '' : ' slot--empty'}`, type: 'button',
      dataset: { active: String(state.activeSlot === key) },
      onclick: () => { state.activeSlot = key; state.query = ''; draw(); },
    },
      filled ? art(i, ' art--lg')
             : el('div', { className: 'art art--lg slot__art', ariaHidden: 'true' }, '+'),
      el('span', { className: 'slot__text' },
        el('span', { className: 'slot__label', textContent: label }),
        el('span', { className: 'slot__name', textContent: filled ? state.pals[i].name : 'Choose a Pal' }),
        filled
          ? el('span', { className: 'slot__meta' },
              el('span', { className: 'slot__no', textContent: `${dexLabel(state.pals[i])} · R${state.pals[i].rarity}` }),
              elementRow(i))
          : el('span', { className: 'slot__no', textContent: 'Pick one from the list' })));
  }

  function slotRow() {
    const defs = SLOTS[state.mode];
    if (!defs.length) return el('div');
    const swap = defs.length === 2 && state.mode === 'child';
    return el('div', { className: `slots${defs.length === 1 ? ' slots--single' : ''}` },
      slot(...defs[0]),
      defs[1] ? el('button', {
        className: 'swap', type: 'button', title: swap ? 'Swap parents' : 'Swap',
        ariaLabel: swap ? 'Swap the two parents' : 'Swap',
        onclick: () => {
          const [x, y] = [defs[0][0], defs[1][0]];
          [state.sel[x], state.sel[y]] = [state.sel[y], state.sel[x]];
          draw();
        },
      }, swap ? '+' : '⇄') : null,
      defs[1] ? slot(...defs[1]) : null);
  }

  /** Icon grid picker: six per row, searchable by name or Paldex number. */
  function picker() {
    const box = $('#picker');
    const defs = SLOTS[state.mode];
    // The picker is always on screen. Modes without slots (Passives, Mutations)
    // use it as a plain browser rather than hiding it.
    const label = defs.find(([k]) => k === state.activeSlot)?.[1] ?? null;
    const q = state.query.trim().toLowerCase().replace('#', '');
    // Dropdowns narrow first, then the query ranks what is left. Without a
    // query the Paldex order is what players expect.
    const pool = state.pals
      .map((p, i) => [p, i])
      .filter(([p]) => (state.mode !== 'mut' || p.variant)
        && (state.rarity === 'all' || p.rarity >= +state.rarity)
        && (state.work === 'all' || p.work[state.work] > 0)
        && (state.element === 'all' || (p.elements ?? []).includes(state.element)));
    const matches = q ? searchPals(pool, q) : pool;

    const search = el('input', {
      className: 'input', type: 'search', value: state.query,
      placeholder: 'Search by name or number…', ariaLabel: 'Search Pals',
      oninput: (e) => { state.query = e.target.value; picker(); },
    });
    const rarity = el('select', {
      className: 'input', ariaLabel: 'Filter by rarity',
      onchange: (e) => { state.rarity = e.target.value; picker(); },
    },
      el('option', { value: 'all', selected: state.rarity === 'all', textContent: 'All rarities' }),
      [5, 8, 10, 20].map((r) => el('option', { value: r, selected: state.rarity === String(r), textContent: `Rarity ${r}+` })));

    const element = el('select', {
      className: 'input', ariaLabel: 'Filter by element',
      onchange: (e) => { state.element = e.target.value; picker(); },
    },
      el('option', { value: 'all', selected: state.element === 'all', textContent: 'All elements' }),
      ELEMENTS.map((name) => el('option', { value: name, selected: state.element === name, textContent: name })));

    const work = el('select', {
      className: 'input', ariaLabel: 'Filter by work suitability',
      onchange: (e) => { state.work = e.target.value; picker(); },
    },
      el('option', { value: 'all', selected: state.work === 'all', textContent: 'All work types' }),
      WORK.map(([key, label]) => el('option', { value: key, selected: state.work === key, textContent: label })));

    box.replaceChildren(
      el('div', { className: 'picker__head' },
        el('h3', { textContent: label ? `Choosing ${label}` : 'All Pals' }),
        // Counts against the filtered pool, not all 299, so "2 of 25 Dragons"
        // reads correctly once a dropdown is set.
        el('span', { className: 'picker__count',
          textContent: q ? `${matches.length} of ${pool.length} Pals` : `${pool.length} Pals` })),
      el('div', { className: 'filters' }, search, element, work, rarity),
      matches.length
        ? el('div', { className: 'grid' }, matches.map(([p, i]) =>
            el('button', {
              className: 'cell', type: 'button',
              dataset: { picked: String(state.sel[state.activeSlot] === i) },
              onclick: () => {
                if (!state.activeSlot) {
                  // Passives has no slot of its own, so a Pal click is most
                  // useful as "show me how to breed this one".
                  state.mode = 'parents';
                  state.sel.target = i;
                  state.activeSlot = 'target';
                  MODES.forEach((m) => $(`#tab-${m}`).setAttribute('aria-selected', String(m === 'parents')));
                  draw();
                  return;
                }
                state.sel[state.activeSlot] = i;
                // Move focus to the next empty slot so two-slot modes fill in one pass.
                const next = defs.find(([k]) => state.sel[k] == null);
                if (next) state.activeSlot = next[0];
                draw();
              },
            }, art(i),
              el('span', { className: 'cell__name', textContent: p.name }),
              el('span', { className: 'cell__meta' },
                el('span', { className: 'cell__no', textContent: dexLabel(p) }),
                elementRow(i)),
              p.variant ? el('span', { className: 'cell__flag', textContent: 'Variant' }) : null,
              workRow(i))))
        : el('div', { className: 'empty', textContent: 'No Pal matches that search.' }));

    // Keep focus in the search field while typing filters the grid.
    if (document.activeElement !== search && state.query) search.focus();
  }

  const empty = (msg) => el('div', { className: 'empty', textContent: msg });

  // ---------------------------------------------------------------- modes --
  const results = {
    child() {
      const { a, b } = state.sel;
      if (a == null || b == null) return empty('Choose both parents to see their offspring.');
      const c = childOf(a, b);
      if (c == null) return empty('That pair has no offspring in the v1.0 breeding table.');
      const p = state.pals[c];
      return el('div', { className: 'child' },
        art(c, ' art--child'),
        el('h3', { textContent: p.name }),
        el('p', { textContent: `${dexLabel(p)} · Rarity ${p.rarity}${p.variant ? ' · Variant form' : ''}` }),
        elementRow(c),
        workRow(c),
        el('div', { className: 'chips' },
          p.variant ? el('span', { className: 'badge badge--variant', textContent: 'Variant' }) : null,
          p.passives.map((i) => el('span', { className: 'badge', textContent: state.passives[i].name }))),
        el('p', { className: 'hint', textContent: `${state.pals[a].name} + ${state.pals[b].name} → ${p.name}` }));
    },

    parents() {
      const t = state.sel.target;
      if (t == null) return empty('Choose a target Pal to see every parent pair.');
      const pairs = parentsOf(t);
      // Easiest first: the lowest combined rarity is the cheapest pair to obtain.
      const sorted = [...pairs].sort((x, y) =>
        (state.pals[x[0]].rarity + state.pals[x[1]].rarity) - (state.pals[y[0]].rarity + state.pals[y[1]].rarity));
      return el('div', {},
        el('div', { className: 'result-head' },
          el('h3', { textContent: `Parent pairs for ${state.pals[t].name}` }),
          el('span', { className: 'pill', textContent: `${pairs.length.toLocaleString()} ${pairs.length === 1 ? 'pair' : 'pairs'}` })),
        pairs.length
          ? el('div', { className: 'rows' }, sorted.slice(0, 200).map(([a, b]) =>
              comboRow(a, b, `R${state.pals[a].rarity + state.pals[b].rarity}`)))
          : empty('No pair produces this Pal — it has to be caught in the wild.'),
        pairs.length > 200 ? el('p', { className: 'hint', textContent: `Showing the 200 easiest of ${pairs.length.toLocaleString()} pairs, by combined parent rarity.` }) : null);
    },

    one() {
      const a = state.sel.one;
      if (a == null) return empty('Choose a parent to see everything it can make.');
      const out = state.pals.map((_, b) => [b, childOf(a, b)]).filter(([, c]) => c != null);
      return el('div', {},
        el('div', { className: 'result-head' },
          el('h3', { textContent: `${state.pals[a].name} paired with every Pal` }),
          el('span', { className: 'pill', textContent: `${out.length.toLocaleString()} results` })),
        out.length
          ? el('div', { className: 'rows' }, out.map(([b, c]) =>
              el('div', { className: 'row' },
                mini(b), el('span', { className: 'arrow', textContent: '→' }), mini(c),
                el('span', { className: `badge${state.pals[c].variant ? ' badge--variant' : ''}`,
                  textContent: state.pals[c].variant ? 'Variant' : `R${state.pals[c].rarity}` }))))
          : empty('This Pal has no breeding pairs at all.'));
    },

    path() {
      const { from, to } = state.sel;
      if (from == null || to == null) return empty('Choose a starting Pal and a target to calculate a route.');
      const steps = shortestPath(from, to);
      if (steps === null) return empty('No breeding chain connects these two Pals.');
      if (!steps.length) return empty('Same Pal — no breeding needed.');
      return el('div', {},
        el('div', { className: 'result-head' },
          el('h3', { textContent: `${state.pals[from].name} → ${state.pals[to].name}` }),
          el('span', { className: 'pill', textContent: `${steps.length} breeding ${steps.length === 1 ? 'step' : 'steps'}` })),
        el('div', { className: 'rows' }, steps.map(([parent, partner, child], n) =>
          el('div', { className: 'row', style: 'grid-template-columns:1fr' },
            el('div', { className: 'path' },
              el('span', { className: 'step' }, el('span', { className: 'step__n', textContent: n + 1 }),
                `${state.pals[parent].name} + ${state.pals[partner].name}`),
              el('span', { className: 'arrow', ariaHidden: 'true' }, '→'),
              el('span', { className: `step${child === to ? ' step--goal' : ''}` },
                el('span', { className: 'step__n', textContent: child === to ? '★' : n + 2 }),
                state.pals[child].name))))),
        el('p', { className: 'hint', textContent: `Each step is one egg. Partners needed: ${[...new Set(steps.map((s) => state.pals[s[1]].name))].join(', ')}.` }));
    },

    pass() {
      state.sel.passive ??= Math.max(0, state.passives.findIndex((p) => p.name === 'Legend'));
      const select = el('select', { className: 'input', ariaLabel: 'Guaranteed passive',
        onchange: (e) => { state.sel.passive = +e.target.value; draw(); } },
        state.passives.map((p, i) => el('option', { value: i, selected: i === state.sel.passive, textContent: `${p.name} (rank ${p.rank})` })));

      const carriers = state.pals.map((p, i) => [p, i]).filter(([p]) => p.passives.includes(state.sel.passive));
      return el('div', {},
        el('div', { className: 'filters', style: 'grid-template-columns:1fr' }, select),
        el('div', { className: 'result-head' },
          el('h3', { textContent: `Pals that always carry ${state.passives[state.sel.passive].name}` }),
          el('span', { className: 'pill', textContent: `${carriers.length} ${carriers.length === 1 ? 'Pal' : 'Pals'}` })),
        carriers.length
          ? el('div', { className: 'rows' }, carriers.map(([, i]) => {
              const n = parentsOf(i).length;
              return el('div', { className: 'row', style: 'grid-template-columns:1fr auto' }, mini(i),
                el('span', { className: 'badge', textContent: n ? `${n.toLocaleString()} ${n === 1 ? 'pair' : 'pairs'}` : 'Catch only' }));
            }))
          : empty('No Pal carries this passive by default.'),
        el('p', { className: 'hint', textContent: 'Guaranteed passives inherit like any other, so a carrier parent is the cheapest way into a four-passive project.' }));
    },

    mut() {
      const variants = state.pals.filter((p) => p.variant).length;
      if (state.sel.variant == null) return empty('Pick a variant Pal from the list.');
      const pairs = parentsOf(state.sel.variant);
      return el('div', {},
        el('div', { className: 'result-head' },
          el('h3', { textContent: `Pairs that produce ${state.pals[state.sel.variant].name}` }),
          el('span', { className: 'pill', textContent: `${variants} variant Pals in v1.0` })),
        pairs.length
          ? el('div', { className: 'rows' }, pairs.map(([a, b]) => comboRow(a, b, 'Variant', true)))
          : empty('This variant cannot be bred — it has to be caught.'));
    },
  };

  // ---------------------------------------------------------------- shell --
  function draw() {
    $('#hint').textContent = HINTS[state.mode];
    $('#slots').replaceChildren(slotRow());
    $('#results').replaceChildren(results[state.mode]());
    picker();
    reportHeight();
  }

  MODES.forEach((mode) => {
    $(`#tab-${mode}`).addEventListener('click', () => {
      state.mode = mode;
      state.activeSlot = SLOTS[mode][0]?.[0] ?? null;
      state.query = '';
      MODES.forEach((m) => $(`#tab-${m}`).setAttribute('aria-selected', String(m === mode)));
      draw();
    });
  });

  // Tell the host page how tall we are, so the iframe never scrolls internally.
  let lastHeight = 0;
  function reportHeight() {
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h === lastHeight) return;
    lastHeight = h;
    parent.postMessage({ type: 'palbreeding:height', height: h }, '*');
  }
  new ResizeObserver(reportHeight).observe(document.documentElement);

  // The host owns the theme; it pushes changes down here.
  addEventListener('message', (e) => {
    if (e.data?.type === 'palbreeding:theme') {
      document.documentElement.setAttribute('data-theme', e.data.theme === 'dark' ? 'dark' : 'light');
    }
  });

  load().then(() => {
    // Open on a pair that resolves, so the first thing a visitor sees is a result.
    state.sel.a = byName('Grizzbolt');
    state.sel.b = byName('Relaxaurus');
    state.sel.target = byName('Anubis');
    state.sel.one = byName('Lamball');
    state.sel.from = byName('Lamball');
    state.sel.to = byName('Anubis');
    state.sel.variant = byName('Eidrolon Ignis');
    state.activeSlot = SLOTS[state.mode][0][0];
    draw();
  }).catch((err) => {
    $('#results').replaceChildren(empty('Could not load breeding data. Reload the page to try again.'));
    console.error(err);
  });
})();
</script>
</body>
</html>
